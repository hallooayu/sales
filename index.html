<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dark Dashboard - Advanced Analytics</title>
    
    <!-- Chart.js & PapaParse -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0b0217;
            --bg-panel: #16082b;
            --bg-sidebar: #0f051e;
            --text-main: #ffffff;
            --text-muted: #8b7d9e;
            --neon-cyan: #00e5ff;
            --neon-pink: #ff007f;
            --neon-green: #baff29;
            --neon-purple: #9d00ff;
            --neon-yellow: #ffc400;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR & TOPBAR */
        .sidebar { width: 250px; background-color: var(--bg-sidebar); padding: 20px; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.05); }
        .sidebar-logo { font-size: 24px; font-weight: 700; color: var(--neon-cyan); margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .menu-item { padding: 12px 15px; color: var(--text-muted); text-decoration: none; display: flex; align-items: center; border-radius: 8px; margin-bottom: 5px; transition: 0.3s; font-size: 14px; }
        .menu-item.active, .menu-item:hover { color: var(--neon-pink); background: rgba(255, 0, 127, 0.1); }
        .menu-section { margin-top: 30px; font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 10px; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .topbar { height: 70px; padding: 0 30px; display: flex; justify-content: space-between; align-items: center; background-color: rgba(22, 8, 43, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); position: sticky; top: 0; z-index: 10; }
        .search-bar { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 20px; color: white; width: 300px; outline: none; }
        
        /* DASHBOARD GRID */
        .dashboard { padding: 30px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
        .panel { background-color: var(--bg-panel); border-radius: 12px; padding: 20px; border: 1px solid rgba(255,255,255,0.03); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .panel-title { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; }

        /* WIDGET SIZING */
        .w-1 { grid-column: span 1; }
        .w-2 { grid-column: span 2; }
        .w-3 { grid-column: span 3; }
        .w-5 { grid-column: span 5; }
        .h-300 { height: 300px; }
        .h-350 { height: 350px; }

        /* Typography & Custom Elements */
        .big-number { font-size: 28px; font-weight: 700; color: var(--neon-cyan); margin-top: 10px; }
        .chart-container { position: relative; height: 100%; width: 100%; }
        
        /* Progress Bars */
        .progress-container { margin-bottom: 15px; }
        .progress-label { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; display: flex; justify-content: space-between; }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; }
        .bg-pink { background: var(--neon-pink); }
        .bg-cyan { background: var(--neon-cyan); }
        .bg-yellow { background: var(--neon-yellow); }

        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--neon-cyan); font-size: 18px; font-weight: bold; z-index: 100; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-logo"><span>≡</span> Dashboard</div>
        <a href="#" class="menu-item active">🏠 Overview</a>
        <a href="#" class="menu-item">📊 Advanced Charts</a>
        <a href="#" class="menu-item">⚙️ Settings</a>
    </aside>

    <main class="main-content">
        <div id="loading">Memuat Data & Grafik Lanjutan...</div>
        
        <header class="topbar">
            <input type="text" class="search-bar" placeholder="Search data...">
        </header>

        <div class="dashboard" id="dashboard-grid" style="opacity: 0; transition: 0.5s;">
            
            <!-- KPIs -->
            <div class="panel w-1" style="display: flex; flex-direction: column; align-items: center;">
                <div class="panel-title">TOTAL CUSTOMERS</div>
                <div style="height: 100px; width: 100px;"><canvas id="chart-customers"></canvas></div>
                <div class="big-number" id="val-customers">0</div>
            </div>
            
            <div class="panel w-1" style="display: flex; flex-direction: column; align-items: center;">
                <div class="panel-title">AVG ORDER VALUE</div>
                <div style="height: 100px; width: 100px;"><canvas id="chart-aov"></canvas></div>
                <div class="big-number" id="val-aov" style="color: var(--neon-pink)">$0</div>
            </div>
            
            <div class="panel w-1" style="display: flex; flex-direction: column; align-items: center;">
                <div class="panel-title">AVG LIFETIME VALUE</div>
                <div style="height: 100px; width: 100px;"><canvas id="chart-ltv"></canvas></div>
                <div class="big-number" id="val-ltv" style="color: var(--neon-green)">$0</div>
            </div>

            <!-- Top Categories -->
            <div class="panel w-2">
                <div class="panel-title">TOP CATEGORIES</div>
                <div id="category-bars"></div>
            </div>

            <!-- NEW: Ribbon Chart (Stacked Area) -->
            <div class="panel w-3 h-300">
                <div class="panel-title">LTV RIBBON (TREN STACKED AREA BY REGION)</div>
                <div class="chart-container"><canvas id="chart-ribbon"></canvas></div>
            </div>

            <!-- NEW: Radar Chart (Classification) -->
            <div class="panel w-2 h-300">
                <div class="panel-title">PROFIL KLASIFIKASI REGION (RADAR)</div>
                <div class="chart-container"><canvas id="chart-radar"></canvas></div>
            </div>

            <!-- NEW: Scatter Plot (Customer Segmentation) -->
            <div class="panel w-5 h-350">
                <div class="panel-title">KLASIFIKASI PELANGGAN: FREQUENCY VS AOV (Warna = Risiko Churn)</div>
                <div class="chart-container"><canvas id="chart-scatter"></canvas></div>
            </div>

        </div>
    </main>

    <script>
        Chart.defaults.color = '#8b7d9e';
        Chart.defaults.font.family = "'Poppins', sans-serif";
        Chart.defaults.scale.grid.color = 'rgba(255, 255, 255, 0.05)';

        let rawData = [];

        document.addEventListener("DOMContentLoaded", () => {
            Papa.parse("sales_and_customer_insights.csv", {
                download: true, header: true, dynamicTyping: true, skipEmptyLines: true,
                complete: function(results) {
                    rawData = results.data;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('dashboard-grid').style.opacity = '1';
                    processDataAndRender();
                }
            });
        });

        function processDataAndRender() {
            // 1. KPI
            const totalCustomers = new Set(rawData.map(d => d.Customer_ID)).size;
            const avgAOV = (rawData.reduce((sum, d) => sum + (d.Average_Order_Value || 0), 0) / rawData.length).toFixed(2);
            const avgLTV = (rawData.reduce((sum, d) => sum + (d.Lifetime_Value || 0), 0) / rawData.length).toFixed(2);

            document.getElementById('val-customers').innerText = totalCustomers.toLocaleString();
            document.getElementById('val-aov').innerText = "$" + avgAOV;
            document.getElementById('val-ltv').innerText = "$" + avgLTV;

            renderDoughnut('chart-customers', [70, 30], ['#00e5ff', 'rgba(0,229,255,0.1)']);
            renderDoughnut('chart-aov', [50, 50], ['#ff007f', 'rgba(255,0,127,0.1)']);
            renderDoughnut('chart-ltv', [85, 15], ['#baff29', 'rgba(186,255,41,0.1)']);

            // 2. Categories
            let catCount = {};
            rawData.forEach(d => { if(d.Most_Frequent_Category) catCount[d.Most_Frequent_Category] = (catCount[d.Most_Frequent_Category] || 0) + 1; });
            let sortedCats = Object.entries(catCount).sort((a, b) => b[1] - a[1]).slice(0, 3);
            let barHTML = '';
            let colors = ['bg-pink', 'bg-cyan', 'bg-yellow'];
            sortedCats.forEach((cat, idx) => {
                let pct = (cat[1] / sortedCats[0][1]) * 100;
                barHTML += `<div class="progress-container"><div class="progress-label"><span>${cat[0]}</span> <span>${cat[1]}</span></div><div class="progress-bar"><div class="progress-fill ${colors[idx]}" style="width: ${pct}%"></div></div></div>`;
            });
            document.getElementById('category-bars').innerHTML = barHTML;

            // 3. GRAFIK PITA (Ribbon / Stacked Area Chart)
            let regions = [...new Set(rawData.map(d => d.Region).filter(Boolean))];
            let seasons = ['Spring', 'Summer', 'Autumn', 'Winter'];
            let neonPalette = ['#00e5ff', '#ff007f', '#baff29', '#9d00ff', '#ffc400'];
            
            let ribbonDatasets = regions.map((reg, i) => {
                return {
                    label: reg,
                    data: seasons.map(s => {
                        let filtered = rawData.filter(d => d.Region === reg && d.Season === s);
                        return filtered.reduce((sum, d) => sum + (d.Lifetime_Value||0), 0) / (filtered.length||1);
                    }),
                    backgroundColor: neonPalette[i % neonPalette.length] + '40', // Transparan 40%
                    borderColor: neonPalette[i % neonPalette.length],
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4 // Membuat gelombang seperti pita
                };
            });

            new Chart(document.getElementById('chart-ribbon').getContext('2d'), {
                type: 'line',
                data: { labels: seasons, datasets: ribbonDatasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#8b7d9e' } } },
                    scales: { y: { stacked: true } } // Fitur utama agar menumpuk seperti pita
                }
            });

            // 4. GRAFIK KLASIFIKASI RADAR
            // Membandingkan metrik antar Region (Top 3 Regions)
            let topRegions = regions.slice(0, 3);
            let radarDatasets = topRegions.map((reg, i) => {
                let rData = rawData.filter(d => d.Region === reg);
                let avgLTVNorm = (rData.reduce((sum, d) => sum + d.Lifetime_Value, 0) / rData.length) / 100; // Skala diperkecil
                let avgAOVNorm = (rData.reduce((sum, d) => sum + d.Average_Order_Value, 0) / rData.length);
                let avgFreqNorm = (rData.reduce((sum, d) => sum + d.Purchase_Frequency, 0) / rData.length) * 5; // Skala diperbesar
                let avgTime = (rData.reduce((sum, d) => sum + d.Time_Between_Purchases, 0) / rData.length);

                return {
                    label: reg,
                    data: [avgLTVNorm, avgAOVNorm, avgFreqNorm, avgTime],
                    backgroundColor: neonPalette[i] + '30',
                    borderColor: neonPalette[i],
                    pointBackgroundColor: neonPalette[i]
                };
            });

            new Chart(document.getElementById('chart-radar').getContext('2d'), {
                type: 'radar',
                data: {
                    labels: ['Skala LTV', 'Avg Order Value', 'Purchase Freq (x5)', 'Time Between'],
                    datasets: radarDatasets
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { r: { grid: { color: 'rgba(255,255,255,0.1)' }, angleLines: { color: 'rgba(255,255,255,0.1)' }, ticks: { display: false } } },
                    plugins: { legend: { position: 'right' } }
                }
            });

            // 5. GRAFIK SEBAR (SCATTER PLOT) UNTUK KLASIFIKASI CHURN
            // Mengambil 400 data sampel pertama agar browser tidak berat
            let sampleData = rawData.slice(0, 400);
            
            // Mengklasifikasikan titik berdasarkan Risiko Churn
            let highRisk = sampleData.filter(d => d.Churn_Probability >= 0.7).map(d => ({x: d.Purchase_Frequency, y: d.Average_Order_Value}));
            let midRisk = sampleData.filter(d => d.Churn_Probability >= 0.4 && d.Churn_Probability < 0.7).map(d => ({x: d.Purchase_Frequency, y: d.Average_Order_Value}));
            let lowRisk = sampleData.filter(d => d.Churn_Probability < 0.4).map(d => ({x: d.Purchase_Frequency, y: d.Average_Order_Value}));

            new Chart(document.getElementById('chart-scatter').getContext('2d'), {
                type: 'scatter',
                data: {
                    datasets: [
                        { label: 'High Churn Risk', data: highRisk, backgroundColor: '#ff007f' },
                        { label: 'Medium Churn Risk', data: midRisk, backgroundColor: '#ffc400' },
                        { label: 'Low Churn Risk', data: lowRisk, backgroundColor: '#00e5ff' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { title: { display: true, text: 'Purchase Frequency', color: '#8b7d9e' } },
                        y: { title: { display: true, text: 'Average Order Value ($)', color: '#8b7d9e' } }
                    }
                }
            });
        }

        function renderDoughnut(id, dataArr, colors) {
            new Chart(document.getElementById(id).getContext('2d'), {
                type: 'doughnut',
                data: { datasets: [{ data: dataArr, backgroundColor: colors, borderWidth: 0, cutout: '80%' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { tooltip: { enabled: false } } }
            });
        }
    </script>
</body>
</html>
