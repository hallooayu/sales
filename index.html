<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Dark Dashboard</title>
    
    <!-- Chart.js & PapaParse -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0b0217;
            --bg-panel: #16082b;
            --bg-sidebar: #0f051e;
            --text-main: #ffffff;
            --text-muted: #8b7d9e;
            --neon-cyan: #00e5ff;
            --neon-pink: #ff007f;
            --neon-green: #baff29;
            --neon-purple: #9d00ff;
            --neon-yellow: #ffc400;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            background-color: var(--bg-sidebar);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .sidebar-logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--neon-cyan);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-item {
            padding: 12px 15px;
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: 0.3s;
            font-size: 14px;
        }
        .menu-item.active, .menu-item:hover {
            color: var(--neon-pink);
            background: rgba(255, 0, 127, 0.1);
        }
        .menu-section {
            margin-top: 30px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        /* TOPBAR */
        .topbar {
            height: 70px;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(22, 8, 43, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .search-bar {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 20px;
            color: white;
            width: 300px;
            outline: none;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .avatar {
            width: 35px;
            height: 35px;
            background: var(--neon-cyan);
            border-radius: 50%;
        }

        /* DASHBOARD GRID */
        .dashboard {
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-auto-rows: minmax(180px, auto);
            gap: 20px;
        }

        .panel {
            background-color: var(--bg-panel);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }
        
        .panel-title {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        /* Widget Sizing */
        .widget-radial { grid-column: span 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .widget-text { grid-column: span 1; }
        .widget-bars { grid-column: span 1; }
        .widget-main-chart { grid-column: span 3; height: 300px; }
        .widget-side-chart { grid-column: span 2; height: 300px; }
        .widget-bottom-1 { grid-column: span 1; }
        .widget-bottom-2 { grid-column: span 2; }
        .widget-bottom-3 { grid-column: span 2; }

        /* Typography & Custom Elements inside Panels */
        .big-number {
            font-size: 28px;
            font-weight: 700;
            color: var(--neon-cyan);
            margin-top: 10px;
        }
        .big-percent {
            font-size: 36px;
            font-weight: 700;
            color: var(--neon-cyan);
            margin: 10px 0;
        }
        
        .chart-container {
            position: relative;
            height: 100%;
            width: 100%;
        }

        /* Custom Progress Bars */
        .progress-container { margin-bottom: 15px; }
        .progress-label { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; display: flex; justify-content: space-between; }
        .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; }
        .bg-pink { background: var(--neon-pink); }
        .bg-cyan { background: var(--neon-cyan); }
        .bg-yellow { background: var(--neon-yellow); }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--neon-cyan); font-size: 18px; font-weight: bold; z-index: 100;
        }
    </style>
