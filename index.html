<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analitik Penjualan & Pelanggan</title>
    
    <!-- Library Chart.js untuk visualisasi data -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Library PapaParse untuk membaca file CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: #2c3e50; }
        
        /* Gaya untuk Slicer/Filter */
        .filters {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #ecf0f1;
            border-radius: 6px;
            flex-wrap: wrap;
        }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .filter-group select {
            padding: 8px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            font-size: 14px;
            min-width: 150px;
            cursor: pointer;
        }

        /* Gaya untuk Tab */
        .tabs {
            display: flex;
            border-bottom: 2px solid #bdc3c7;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            color: #7f8c8d;
            transition: 0.3s;
        }
        .tab-btn:hover { color: #2c3e50; }
        .tab-btn.active {
            color: #2980b9;
            border-bottom: 3px solid #2980b9;
            margin-bottom: -2px;
        }

        /* Konten Tab */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Container Grafik */
        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }
        
        #loading {
            text-align: center;
            font-size: 18px;
            color: #e67e22;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Dashboard Penjualan & Analisis Pelanggan</h1>

    <div id="loading">Memuat data dari CSV...</div>

    <!-- Slicers -->
    <div class="filters">
        <div class="filter-group">
            <label for="slicer-region">Region:</label>
            <select id="slicer-region" class="slicer">
                <option value="All">Semua Region</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="slicer-season">Musim (Season):</label>
            <select id="slicer-season" class="slicer">
                <option value="All">Semua Musim</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="slicer-strategy">Strategi Retensi:</label>
            <select id="slicer-strategy" class="slicer">
                <option value="All">Semua Strategi</option>
            </select>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="tab-revenue">Pendapatan (LTV)</button>
        <button class="tab-btn" data-tab="tab-category">Kategori Terpopuler</button>
        <button class="tab-btn" data-tab="tab-churn">Analisis Churn</button>
    </div>

    <!-- Konten Tab 1: Pendapatan -->
    <div id="tab-revenue" class="tab-content active">
        <h3>Rata-rata Lifetime Value Berdasarkan Region</h3>
        <div class="chart-container">
            <canvas id="chart-ltv"></canvas>
        </div>
    </div>

    <!-- Konten Tab 2: Kategori -->
    <div id="tab-category" class="tab-content">
        <h3>Distribusi Kategori Produk Terlaris</h3>
        <div class="chart-container">
            <canvas id="chart-cat"></canvas>
        </div>
    </div>

    <!-- Konten Tab 3: Churn -->
    <div id="tab-churn" class="tab-content">
        <h3>Rata-rata Probabilitas Churn Berdasarkan Strategi Retensi (%)</h3>
        <div class="chart-container">
            <canvas id="chart-churn"></canvas>
        </div>
    </div>
</div>

<script>
    let allData = [];
    let charts = {};

    document.addEventListener("DOMContentLoaded", () => {
        // 1. Inisialisasi Fungsi Tab
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                e.target.classList.add('active');
                document.getElementById(e.target.dataset.tab).classList.add('active');
            });
        });

        // 2. Load File CSV secara otomatis (pastikan ada di folder yang sama)
        Papa.parse("sales_and_customer_insights.csv", {
            download: true,
            header: true,
            dynamicTyping: true,
            skipEmptyLines: true,
            complete: function(results) {
                allData = results.data;
                document.getElementById('loading').style.display = 'none';
                
                initSlicers();
                createCharts();
                updateDashboard(); // Render pertama kali
            },
            error: function(err) {
                document.getElementById('loading').innerText = "Gagal memuat file! Pastikan 'sales_and_customer_insights.csv' berada di direktori yang sama di GitHub Anda.";
                document.getElementById('loading').style.color = "red";
            }
        });

        // 3. Listener untuk Slicer
        document.querySelectorAll('.slicer').forEach(el => {
            el.addEventListener('change', updateDashboard);
        });
    });

    // Mengisi dropdown otomatis dari nilai unik di CSV
    function initSlicers() {
        const regions = [...new Set(allData.map(d => d.Region).filter(Boolean))];
        const seasons = [...new Set(allData.map(d => d.Season).filter(Boolean))];
        const strategies = [...new Set(allData.map(d => d.Retention_Strategy).filter(Boolean))];

        populateDropdown('slicer-region', regions);
        populateDropdown('slicer-season', seasons);
        populateDropdown('slicer-strategy', strategies);
    }

    function populateDropdown(id, options) {
        const select = document.getElementById(id);
        options.forEach(opt => {
            const option = document.createElement('option');
            option.value = opt;
            option.text = opt;
            select.appendChild(option);
        });
    }

    // Memfilter data berdasarkan slicer aktif
    function getFilteredData() {
        const region = document.getElementById('slicer-region').value;
        const season = document.getElementById('slicer-season').value;
        const strategy = document.getElementById('slicer-strategy').value;

        return allData.filter(d => {
            return (region === 'All' || d.Region === region) &&
                   (season === 'All' || d.Season === season) &&
                   (strategy === 'All' || d.Retention_Strategy === strategy);
        });
    }

    // Membuat instance grafik Chart.js yang kosong
    function createCharts() {
        // Bar Chart - LTV
        const ctxLTV = document.getElementById('chart-ltv').getContext('2d');
        charts.ltv = new Chart(ctxLTV, {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Avg Lifetime Value (USD)', backgroundColor: '#3498db', data: [] }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // Pie Chart - Kategori Terpopuler
        const ctxCat = document.getElementById('chart-cat').getContext('2d');
        charts.cat = new Chart(ctxCat, {
            type: 'pie',
            data: { labels: [], datasets: [{ data: [], backgroundColor: ['#e74c3c', '#2ecc71', '#f1c40f', '#9b59b6', '#34495e', '#1abc9c', '#e67e22'] }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });

        // Bar Chart - Probabilitas Churn
        const ctxChurn = document.getElementById('chart-churn').getContext('2d');
        charts.churn = new Chart(ctxChurn, {
            type: 'bar',
            data: { labels: [], datasets: [{ label: 'Probabilitas Churn (%)', backgroundColor: '#e74c3c', data: [] }] },
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
        });
    }

    // Mengupdate data grafik setiap kali filter berubah
    function updateDashboard() {
        const data = getFilteredData();

        // Update Chart 1: Rata-rata LTV per Region
        const ltvAgg = aggregateData(data, 'Region', 'Lifetime_Value', 'avg');
        charts.ltv.data.labels = Object.keys(ltvAgg);
        charts.ltv.data.datasets[0].data = Object.values(ltvAgg);
        charts.ltv.update();

        // Update Chart 2: Jumlah Transaksi per Kategori
        const catAgg = aggregateData(data, 'Most_Frequent_Category', null, 'count');
        charts.cat.data.labels = Object.keys(catAgg);
        charts.cat.data.datasets[0].data = Object.values(catAgg);
        charts.cat.update();

        // Update Chart 3: Rata-rata Churn per Strategi Retensi
        const churnAgg = aggregateData(data, 'Retention_Strategy', 'Churn_Probability', 'avg');
        charts.churn.data.labels = Object.keys(churnAgg);
        charts.churn.data.datasets[0].data = Object.values(churnAgg).map(v => v * 100); // Ubah ke persen
        charts.churn.update();
    }

    // Fungsi utilitas untuk aggregasi (Group By)
    function aggregateData(data, groupCol, valCol, method) {
        let result = {};
        let counts = {};
        
        data.forEach(row => {
            let key = row[groupCol];
            if(!key) return; // lewati jika kosong
            
            if(!result[key]) { result[key] = 0; counts[key] = 0; }
            
            if (method === 'avg' || method === 'sum') {
                result[key] += (row[valCol] || 0);
            }
            counts[key] += 1;
        });

        if (method === 'avg') {
            for(let k in result) { result[k] = parseFloat((result[k] / counts[k]).toFixed(2)); }
        } else if (method === 'count') {
            return counts;
        }
        return result;
    }
</script>

</body>
</html>
